name: Node.js CI and Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package application
        run: npm pack

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: application-package-node-${{ matrix.node-version }}
          path: "*.tgz"

  docker-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ShopEasy Lite
        uses: docker/build-push-action@v6
        with:
          context: ./shopeasy-lite
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopeasy-lite:v${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/shopeasy-lite:latest